<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vorschau · Empfehlungsseite Weiß-Gold (Rahmen)</title>
  <style>
    body{margin:0;background:#f2f2f2;color:#333;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    header{background:#fff;border-bottom:1px solid #d9d9d9;padding:14px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2}
    h1{margin:0;font-size:16px;font-weight:650}
    .gruppe{display:flex;gap:8px;align-items:center}
    .gruppe small{color:#5c5c5c;font-size:12px;margin-right:4px}
    button{font:inherit;font-size:13px;min-height:40px;padding:0 14px;border:1px solid #d9d9d9;border-radius:3px;background:#fff;color:#333;cursor:pointer}
    button[aria-pressed="true"]{background:#c8aa22;border-color:#c8aa22;color:#2b2b2b;font-weight:650}
    button:focus-visible{outline:3px solid #786614;outline-offset:2px}
    .hinweis{margin-left:auto;color:#5c5c5c;font-size:12px;max-width:420px;line-height:1.45}
    main{padding:20px;display:flex;justify-content:center}
    .buehne{background:#fff;border:1px solid #d9d9d9;box-shadow:0 1px 2px rgba(0,0,0,.05);width:100%;max-width:1440px;transition:max-width .2s}
    .buehne.handy{max-width:390px}
    iframe{display:block;width:100%;height:calc(100vh - 130px);border:0}
    .buehne.handy iframe{height:844px}
  </style>
</head>
<body>
  <header>
    <h1>Empfehlungsseite · Vorschau Weiß-Gold</h1>
    <div class="gruppe">
      <small>Ansicht</small>
      <button type="button" data-ansicht="kai" aria-pressed="true">Kai zugeordnet</button>
      <button type="button" data-ansicht="neutral" aria-pressed="false">Ohne Zuordnung</button>
    </div>
    <div class="gruppe">
      <small>Empfehlung</small>
      <button type="button" data-empfehler="keiner" aria-pressed="true">Ohne</button>
      <button type="button" data-empfehler="beispiel" aria-pressed="false">Beispiel</button>
    </div>
    <div class="gruppe">
      <small>Größe</small>
      <button type="button" data-groesse="rechner" aria-pressed="true">Rechner</button>
      <button type="button" data-groesse="handy" aria-pressed="false">Handy</button>
    </div>
    <p class="hinweis">Nur Vorschau. Es wird nichts gesendet, nichts gebucht und nichts gespeichert. Die Empfehlung „Anna" sind Beispieldaten.</p>
  </header>
  <main>
    <div class="buehne" id="buehne">
      <iframe id="rahmen" title="Vorschau der Empfehlungsseite" src="vorschau-empfaenger-weissgold.html?ansicht=kai"></iframe>
    </div>
  </main>
  <script>
    const zustand = { ansicht: 'kai', empfehler: 'keiner', groesse: 'rechner' };
    const rahmen = document.getElementById('rahmen');
    const buehne = document.getElementById('buehne');

    function lade() {
      const p = new URLSearchParams({ ansicht: zustand.ansicht });
      if (zustand.empfehler === 'beispiel') p.set('empfehler', 'beispiel');
      rahmen.src = `vorschau-empfaenger-weissgold.html?${p.toString()}`;
      buehne.classList.toggle('handy', zustand.groesse === 'handy');
    }

    document.querySelectorAll('button[data-ansicht],button[data-empfehler],button[data-groesse]').forEach((b) => {
      b.addEventListener('click', () => {
        const art = b.dataset.ansicht ? 'ansicht' : (b.dataset.empfehler ? 'empfehler' : 'groesse');
        zustand[art] = b.dataset[art];
        document.querySelectorAll(`button[data-${art}]`).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        lade();
      });
    });
  </script>
</body>
</html>
