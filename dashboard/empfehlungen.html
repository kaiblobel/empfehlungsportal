<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Empfehlungen · Empfehlungsportal</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/style.css?v=38" />
  <link rel="stylesheet" href="../css/dashboard.css?v=56" />
  <link rel="stylesheet" href="../css/dna.css?v=13" />
  <!-- Nach dna.css, weil die Listenregeln eigene Klassennamen haben und
       nicht von deren Nachzuegen ueberschrieben werden sollen. -->
  <link rel="stylesheet" href="../css/listen.css?v=1" />
  <script src="../js/config.js"></script>
  <script src="../js/wartung.js?v=4"></script>
</head>
<body class="has-app-nav emp-page">

  <div id="appNav"></div>

  <div class="app-shell">
    <header class="app-header">
      <div class="app-header-left">
        <img class="app-header-photo" id="hdrPhoto" alt="" />
        <div>
          <div class="app-header-name" id="hdrName">…</div>
          <div class="app-header-sub">Empfehlungsmanagement</div>
        </div>
      </div>
      <div class="app-header-right">
        <a href="../hub.html" class="btn-hub-back" title="Zum Überblick">← <span class="lbl">Überblick</span></a>
        <button class="btn-logout" id="logoutBtn">Abmelden</button>
      </div>
    </header>

    <main class="app-content emp-content">
      <!-- Der Erklaersatz ist weg. Wer die Seite oeffnet, weiss was
           Empfehlungen sind; der Platz gehoert den Menschen darunter. -->
      <section class="liste-kopf">
        <div>
          <div class="h-label">Tagesgeschäft</div>
          <h1>Empfehlungen</h1>
        </div>
        <a href="neu.html" class="liste-haupttun">+ Neue Empfehlung</a>
      </section>

      <!-- Sichtbar bleiben die vier Filter, die im Alltag gebraucht werden.
           Alles Weitere steht unter "Weitere Filter": frueher lagen bis zu
           vierzehn Knoepfe ueber der ersten Person. -->
      <div class="liste-leiste" role="group" aria-label="Empfehlungen suchen und filtern">
        <label class="liste-suche" for="searchInput">
          <i data-icon="Search" data-icon-size="16"></i>
          <input id="searchInput" type="search" placeholder="Name, Telefon oder Promoter suchen" autocomplete="off" />
        </label>
        <div class="liste-reiter" id="filterTabs" aria-label="Statusfilter"></div>
        <button class="liste-mehr" type="button" id="mehrBtn" aria-expanded="false" aria-controls="mehrFeld">Weitere Filter</button>
        <div class="liste-weitere liste-spalte" id="mehrFeld">
          <div class="liste-reiter" id="filterTabsMehr" aria-label="Weitere Zustände"></div>

          <!-- Erscheint nur bei Fuehrungskraeften, also wenn wirklich
               jemand unter einem haengt. -->
          <div class="liste-reiter" id="scopeTabs" role="group" aria-label="Bereich" hidden>
            <button type="button" data-scope="mein" aria-pressed="true">Meine</button>
            <button type="button" data-scope="team" aria-pressed="false">Mein Team</button>
          </div>

          <!-- Woher jemand kommt. Erscheint erst, wenn wirklich Leads aus
               einem Funnel da sind: solange nur Empfehlungen im Bestand
               sind, waere die Zeile eine Auswahl ohne Auswahl. -->
          <div class="liste-reiter" id="artTabs" role="group" aria-label="Herkunft" hidden>
            <button type="button" data-art="alle" aria-pressed="true">Alle Herkünfte</button>
            <button type="button" data-art="empfehlung" aria-pressed="false">Empfehlungen</button>
            <button type="button" data-art="funnel" aria-pressed="false">Funnels</button>
          </div>
          <div class="liste-reiter" id="quellenTabs" role="group" aria-label="Welcher Funnel" hidden></div>
        </div>
      </div>

      <section id="prioritySection" hidden>
        <div class="liste-abschnitt">
          <h2>Wartet auf dich</h2>
          <span id="prioMeta"></span>
        </div>
        <div class="liste-dringend-block" id="priorityList"></div>
      </section>

      <div class="liste-abschnitt">
        <h2>Alle weiteren</h2>
        <span id="resultMeta">Wird geladen…</span>
      </div>
      <div id="list" aria-live="polite">
        <div class="skel-row"><div class="skel-body"><span class="skel skel-line"></span><span class="skel skel-line"></span></div><span class="skel skel-tail"></span></div>
        <div class="skel-row"><div class="skel-body"><span class="skel skel-line"></span><span class="skel skel-line"></span></div><span class="skel skel-tail"></span></div>
      </div>
      <div class="ep-hint"><span><strong>Rechtsklick</strong> öffnet weitere Aktionen.</span><span id="totalMeta"></span></div>
    </main>

    <script type="module" src="../js/nav.js?v=71"></script>
  </div>

  <!-- Schnell-Menü (Rechtsklick auf eine Empfehlung) -->
  <div id="ctxMenu" class="ctx-menu" role="menu" hidden>
    <div class="ctx-head" id="ctxHead">Empfehlung</div>
    <button class="ctx-item ctx-kunde" role="menuitem" data-act="status" data-val="kunde">
      <span class="ctx-dot dot-kunde"></span>Als Kunde gewonnen
    </button>
    <button class="ctx-item" role="menuitem" data-act="interessiert">
      <span class="ctx-dot dot-interessiert"></span>Interessent
    </button>
    <button class="ctx-item" role="menuitem" data-act="status" data-val="anrufwunsch">
      <span class="ctx-dot dot-anrufwunsch"></span>Anrufwunsch
    </button>
    <button class="ctx-item" role="menuitem" data-act="status" data-val="kontaktiert">
      <span class="ctx-dot dot-kontaktiert"></span>Kontaktiert
    </button>
    <button class="ctx-item" role="menuitem" data-act="status" data-val="kein_interesse">
      <span class="ctx-dot dot-kein_interesse"></span>Kein Interesse
    </button>
    <button class="ctx-item" role="menuitem" data-act="status" data-val="offen">
      <span class="ctx-dot dot-offen"></span>Zurück auf offen
    </button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" role="menuitem" data-act="edit">Bearbeiten…</button>
    <button class="ctx-item" role="menuitem" data-act="new">Neue Empfehlung…</button>
    <button class="ctx-item ctx-danger" role="menuitem" data-act="delete">Löschen…</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item ctx-open" role="menuitem" data-act="open">Details öffnen &rsaquo;</button>
  </div>
  <div id="toast" class="toast" hidden></div>

  <!-- Inline-Bearbeiten-Overlay (Rechtsklick > Bearbeiten) -->
  <div id="editModal" class="edit-modal" hidden>
    <div class="edit-modal-backdrop" id="editModalBd"></div>
    <div class="edit-modal-card" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <h3 class="edit-modal-title" id="editModalTitle">Empfehlung bearbeiten</h3>
      <div class="edit-field">
        <label for="editName">Name</label>
        <input id="editName" type="text" autocomplete="off" />
      </div>
      <div class="edit-field">
        <label for="editTel">Telefon</label>
        <input id="editTel" type="tel" autocomplete="off" />
      </div>
      <div class="edit-field">
        <label for="editThema">Thema</label>
        <select id="editThema"><option value="">— kein Thema —</option></select>
      </div>
      <div class="edit-field">
        <label for="editNotiz">Notiz</label>
        <textarea id="editNotiz" rows="2"></textarea>
      </div>
      <div class="edit-actions">
        <button class="edit-btn" id="editCancel" type="button">Abbrechen</button>
        <button class="edit-btn primary" id="editSave" type="button">Speichern</button>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      requireAuth, logout, loadEmpfehlungen, updateStatus, setInteressiert,
      updateEmpfehlung, formatDate, applyBeraterHeader, whatsappLink,
    } from '../js/dashboard.js';
    import { deleteEmpfehlung, getVorlagen, markiereGesehen, getFunnelQuellen, themaGesperrt } from '../js/supabase.js';
    import { hydrateIcons, icon } from '../js/icons.js';

    applyBeraterHeader();
    hydrateIcons();
    document.getElementById('logoutBtn').addEventListener('click', logout);

    const FILTERS = [
      ['alle', 'Alle'], ['offen', 'Offen'], ['anrufwunsch', 'Anrufwunsch'],
      ['interessiert', 'Interesse'], ['kontaktiert', 'Kontaktiert'],
      ['kunde', 'Kunde'], ['kein_interesse', 'Kein Interesse'],
    ];
    /* Sichtbar bleiben die vier, die im Alltag gebraucht werden. Der Rest
       steht unter "Weitere Filter". Wer dort einen auswaehlt, sieht ihn
       trotzdem: das Feld bleibt dann offen. */
    const FILTER_SICHTBAR = new Set(['alle', 'offen', 'anrufwunsch', 'interessiert']);
    const THEMA_LABELS = {
      allgemein: 'Allgemeine Beratung', baufi: 'Baufinanzierung', foerderungen: 'Staatliche Förderungen',
      selbstaendige: 'Selbständige', investment: 'Geldanlage & Investment',
      absicherung: 'Absicherung & Familie', karriere: 'Berufliche Perspektive', kinder: 'Für deine Kinder',
    };
    /* Woher ein Kontakt kommt (Phase 271). Eine Empfehlung kommt über einen
       Menschen, ein Lead über eine Funnel-Seite. Beides ist dieselbe Arbeit,
       deshalb dieselbe Liste — aber man muss auf einen Blick sehen, was man
       vor sich hat. Neue Funnels hier eintragen. */
    /* Namen und Farben der Funnels kommen aus der Tabelle funnel_quellen.
       Bis sie geladen ist, steht der technische Name da: lieber der als
       eine leere Zeile. */
    let QUELLEN = {};
    const quelleLabel = (q) => (QUELLEN[q] && QUELLEN[q].anzeige) || q || 'Funnel';
    const istLead = (r) => r.typ === 'funnel' || Boolean(r.quelle);

    const urlParams = new URLSearchParams(window.location.search);
    const allowed = new Set(FILTERS.map(([key]) => key));
    const initParam = urlParams.get('status');
    let currentFilter = initParam && allowed.has(initParam) ? initParam : 'alle';
    let currentSearch = '';
    let allItems = [];
    let currentArt = 'alle';      // alle · empfehlung · funnel
    /* Wer oben unter "Wartet auf dich" steht, steht nicht noch einmal in
       der Liste darunter. Genau diese Doppelung hat die erste Person am
       Handy frueher um rund 1300 Punkte nach unten geschoben. */
    let obenSchon = new Set();
    let currentQuelle = 'alle';   // welcher Funnel, wenn currentArt = funnel

    /* Phase 199 · Umschalter "Meine" / "Mein Team". Erscheint nur bei
       Führungskräften, also wenn wirklich jemand unter einem hängt. */
    const SCOPE_KEY = 'empfehlungen_scope_v1';
    let bereich = (() => {
      try { return localStorage.getItem(SCOPE_KEY) === 'team' ? 'team' : 'mein'; } catch (_) { return 'mein'; }
    })();

    (async () => {
      const session = await requireAuth();
      if (!session) return;
      await richteBereichsUmschalterEin();
      await refresh();
      // Phase 211: Wer die Liste offen hat, hat sie gesehen. Läuft nebenher,
      // der Zähler im Menü ist es nicht wert, das Laden aufzuhalten.
      markiereGesehen('empfehlungen');
    })();

    async function richteBereichsUmschalterEin() {
      const tabs = document.getElementById('scopeTabs');
      if (!tabs) return;
      const { getTeamBestand } = await import('../js/supabase.js');
      const ast = await getTeamBestand(30);
      if ((ast || []).length < 2) { bereich = 'mein'; return; }

      tabs.hidden = false;
      tabs.querySelectorAll('[data-scope]').forEach((b) => {
        b.setAttribute('aria-pressed', String(b.dataset.scope === bereich));
        b.addEventListener('click', async () => {
          if (b.dataset.scope === bereich) return;
          bereich = b.dataset.scope;
          try { localStorage.setItem(SCOPE_KEY, bereich); } catch (_) {}
          tabs.querySelectorAll('[data-scope]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
          await refresh();
        });
      });
    }

    /* "Weitere Filter" auf- und zuklappen. */
    const mehrBtn = document.getElementById('mehrBtn');
    const mehrFeld = document.getElementById('mehrFeld');
    mehrBtn.addEventListener('click', () => zeigeMehr(mehrBtn.getAttribute('aria-expanded') !== 'true'));
    function zeigeMehr(offen) {
      mehrBtn.setAttribute('aria-expanded', String(offen));
      mehrFeld.dataset.offen = offen ? 'ja' : 'nein';
    }

    document.querySelector('.liste-leiste').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      currentFilter = btn.dataset.filter;
      const nextUrl = new URL(window.location.href);
      if (currentFilter === 'alle') nextUrl.searchParams.delete('status');
      else nextUrl.searchParams.set('status', currentFilter);
      history.replaceState({}, '', nextUrl);
      render();
    });

    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        currentSearch = e.target.value.trim().toLowerCase();
        render();
      }, 200);
    });

    async function refresh() {
      const list = document.getElementById('list');
      list.innerHTML = '<div class="skel-row"><div class="skel-body"><span class="skel skel-line"></span><span class="skel skel-line"></span></div><span class="skel skel-tail"></span></div><div class="skel-row"><div class="skel-body"><span class="skel skel-line"></span><span class="skel skel-line"></span></div><span class="skel skel-tail"></span></div>';
      const [rows, quellen] = await Promise.all([
        loadEmpfehlungen({ filter: 'alle', bereich }),
        getFunnelQuellen(),
      ]);
      allItems = rows;
      QUELLEN = quellen;
      render();
    }

    function render() {
      renderFilters();
      renderHerkunft();
      renderPriorities();
      const visibleItems = allItems.filter(matchesCurrentView).filter(r => !obenSchon.has(String(r.id)));
      const list = document.getElementById('list');
      document.getElementById('resultMeta').textContent = visibleItems.length === 1 ? '1 Kontakt' : `${visibleItems.length} Kontakte`;
      document.getElementById('totalMeta').textContent = `${allItems.length} Empfehlungen insgesamt`;
      if (!visibleItems.length) {
        list.innerHTML = '<div class="liste-leer">Für diese Auswahl gibt es aktuell keine Empfehlungen.</div>';
        return;
      }
      // Phase 199 · Eine Empfehlung aus dem Team gehört einem anderen Berater.
      // Sie wird gezeigt, aber nicht verlinkt: die Detailseite fände sie wegen
      // der Leseregel ohnehin nicht und liefe in eine leere Ansicht.
      const zeile = (r) => {
        const status = effectiveStatus(r);
        const ton = tonVon(status);
        const leise = ['offen', 'kontaktiert'].includes(status);
        const inhalt = `
          <span class="liste-kreis">${initials(r.empfaenger_name)}</span>
          <span class="liste-mitte">
            <span class="liste-name">${escapeHtml(r.empfaenger_name || 'Unbekannter Kontakt')}</span>
            <span class="liste-zeile2"><b class="liste-zustand${leise ? ' leise' : ''}">${STATUS_TEXT[status] || status}</b><span class="liste-punkt">·</span>${escapeHtml(topicLabel(r))}${herkunftKurz(r)}</span>
          </span>
          <span class="liste-neben">
            ${r.ist_test ? '<span class="liste-test">Testeintrag</span>' : ''}
            <span class="liste-zeit">${formatDate(r.created_at)}</span>
            ${r.fremd ? `<span class="liste-zeit">${escapeHtml(r.berater_name || 'anderer Bestand')}</span>` : ''}
          </span>
          ${r.fremd ? '<span></span>' : `<span class="liste-pfeil">${icon('ChevronRight', { size: 15 })}</span>`}`;
        const merkmale = `data-id="${escapeHtml(r.id)}" data-status="${escapeHtml(r.status || 'offen')}"${ton ? ` data-ton="${ton}"` : ''}`;
        return r.fremd
          ? `<div class="liste-zeile" ${merkmale}>${inhalt}</div>`
          : `<a class="liste-zeile" href="detail.html?id=${encodeURIComponent(r.id)}" ${merkmale}>${inhalt}</a>`;
      };

      // Nach Alter gruppiert. Eine Gruppe ohne Eintraege faellt weg.
      list.innerHTML = '<div class="liste-block">' + GRUPPEN.map(([schluessel, titel]) => {
        const teil = visibleItems.filter(r => gruppeVon(r.created_at) === schluessel);
        if (!teil.length) return '';
        return `<div class="liste-gruppe"><span>${titel}</span><b>${teil.length}</b></div>` + teil.map(zeile).join('');
      }).join('') + '</div>';
    }

    /* Die Herkunfts-Reiter erscheinen erst, wenn wirklich Leads da sind.
       Und die Liste der Funnels baut sich aus dem auf, was im Bestand
       steht: kein Reiter fuer einen Funnel, der nichts geliefert hat. */
    function renderHerkunft() {
      const leads = allItems.filter(istLead);
      const artTabs = document.getElementById('artTabs');
      const quellenTabs = document.getElementById('quellenTabs');
      artTabs.hidden = leads.length === 0;
      if (leads.length === 0) {
        quellenTabs.hidden = true;
        return;
      }
      artTabs.querySelectorAll('[data-art]').forEach((b) => {
        b.setAttribute('aria-pressed', String(b.dataset.art === currentArt));
      });

      const zeigen = currentArt === 'funnel';
      quellenTabs.hidden = !zeigen;
      if (!zeigen) return;

      const vorhanden = [...new Set(leads.map(r => r.quelle).filter(Boolean))].sort();
      quellenTabs.innerHTML = [['alle', `alle Funnels (${leads.length})`]]
        .concat(vorhanden.map(q => [q, `${quelleLabel(q)} (${leads.filter(r => r.quelle === q).length})`]))
        .map(([key, label]) => `
          <button type="button" data-quelle="${escapeHtml(key)}" aria-pressed="${key === currentQuelle}">${escapeHtml(label)}</button>`)
        .join('');
    }

    document.getElementById('artTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-art]');
      if (!btn) return;
      currentArt = btn.dataset.art;
      if (currentArt !== 'funnel') currentQuelle = 'alle';
      render();
    });

    document.getElementById('quellenTabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-quelle]');
      if (!btn) return;
      currentQuelle = btn.dataset.quelle;
      render();
    });

    function renderFilters() {
      const counts = Object.fromEntries(FILTERS.map(([key]) => [key, key === 'alle' ? allItems.length : allItems.filter(r => effectiveStatus(r) === key).length]));
      const knopf = ([key, label]) => `
        <button type="button" data-filter="${key}" aria-pressed="${currentFilter === key}">
          ${label} <b>${counts[key]}</b>
        </button>`;
      document.getElementById('filterTabs').innerHTML =
        FILTERS.filter(([key]) => FILTER_SICHTBAR.has(key)).map(knopf).join('');
      document.getElementById('filterTabsMehr').innerHTML =
        FILTERS.filter(([key]) => !FILTER_SICHTBAR.has(key)).map(knopf).join('');
      // Ein ausgewaehlter Filter darf nicht hinter einer zugeklappten
      // Flaeche verschwinden: sonst sucht man den Grund fuer die kurze
      // Liste und findet ihn nicht.
      if (!FILTER_SICHTBAR.has(currentFilter)) zeigeMehr(true);
    }

    function renderPriorities() {
      const prioritySection = document.getElementById('prioritySection');
      const priorityItems = allItems
        .filter(r => ['anrufwunsch', 'interessiert'].includes(effectiveStatus(r)))
        .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))
        .slice(0, 4);
      prioritySection.hidden = priorityItems.length === 0 || currentFilter !== 'alle' || Boolean(currentSearch);
      obenSchon = prioritySection.hidden ? new Set() : new Set(priorityItems.map(r => String(r.id)));
      document.getElementById('prioMeta').textContent =
        priorityItems.length ? `${priorityItems.length} von ${allItems.length}` : '';
      /* Frueher stand hier eine Karte mit einem ausformulierten Satz, der
         auf jeder Karte gleich lief. Jetzt eine Zeile: Name, Zustand,
         Thema, und daneben das, was man tun kann. */
      document.getElementById('priorityList').innerHTML = priorityItems.map(r => {
        const zustand = effectiveStatus(r) === 'interessiert' ? 'Interessiert' : 'Anrufwunsch';
        const phone = String(r.empfaenger_telefon || '').trim();
        const phoneHref = phone ? `tel:${phone.replace(/[^+\d]/g, '')}` : '';
        return `<div class="liste-dringend" data-ton="achtung">
          <span class="liste-kreis">${initials(r.empfaenger_name)}</span>
          <span class="liste-mitte">
            <span class="liste-name gross">${escapeHtml(r.empfaenger_name || 'Unbekannter Kontakt')}</span>
            <span class="liste-zeile2"><b class="liste-zustand">${zustand}</b><span class="liste-punkt">·</span>${escapeHtml(topicLabel(r))}${herkunftKurz(r)}</span>
          </span>
          <span class="liste-tuen">
            ${phoneHref
              ? `<a class="liste-tun haupt" href="${phoneHref}">${icon('PhoneCall', { size: 14 })} Anrufen</a>
                 <a class="liste-tun" href="${whatsappLink(phone)}" target="_blank" rel="noopener">WhatsApp</a>`
              : '<span class="liste-tun leer">Keine Nummer</span>'}
            <a class="liste-tun" href="detail.html?id=${encodeURIComponent(r.id)}">Details</a>
          </span>
        </div>`;
      }).join('');
    }

    /* Die Herkunft in der kurzen Fassung. Steht der Promotername nicht in
       der Empfehlung, steht hier nichts: "ueber unbekannt" auf jeder
       zweiten Zeile ist keine Auskunft, sondern Fuellung. */
    function herkunftKurz(r) {
      if (istLead(r)) return `<span class="liste-punkt">·</span>${escapeHtml(quelleLabel(r.quelle))}`;
      const name = String(r.empfehler_name || '').trim();
      return name ? `<span class="liste-punkt">·</span>von ${escapeHtml(name)}` : '';
    }

    /* Wie alt ein Kontakt ist, in drei Stufen. Vierzig gleich hohe Zeilen
       ohne Zwischenkopf sind eine graue Wand. */
    const GRUPPEN = [['heute', 'Heute'], ['woche', 'Diese Woche'], ['aelter', 'Älter']];
    function gruppeVon(iso) {
      const d = new Date(iso || 0);
      if (Number.isNaN(d.getTime())) return 'aelter';
      const heute = new Date();
      const tagAnfang = new Date(heute.getFullYear(), heute.getMonth(), heute.getDate());
      if (d >= tagAnfang) return 'heute';
      if (d >= new Date(tagAnfang.getTime() - 7 * 864e5)) return 'woche';
      return 'aelter';
    }

    /* Der Ton einer Zeile: etwas verlangt Aufmerksamkeit, etwas ist
       gelungen, alles andere bleibt still. */
    function tonVon(status) {
      if (['anrufwunsch', 'interessiert'].includes(status)) return 'achtung';
      if (status === 'kunde') return 'kunde';
      return '';
    }

    function matchesCurrentView(r) {
      if (currentFilter !== 'alle' && effectiveStatus(r) !== currentFilter) return false;
      if (currentArt === 'empfehlung' && istLead(r)) return false;
      if (currentArt === 'funnel') {
        if (!istLead(r)) return false;
        if (currentQuelle !== 'alle' && r.quelle !== currentQuelle) return false;
      }
      if (!currentSearch) return true;
      // Die Herkunft ist mitdurchsuchbar: "restschuld" findet die Leads von dort.
      return [r.empfaenger_name, r.empfaenger_telefon, r.empfaenger_email,
              r.empfehler_name, topicLabel(r), quelleLabel(r.quelle)]
        .some(value => String(value || '').toLowerCase().includes(currentSearch));
    }

    function effectiveStatus(r) {
      const status = r.status || 'offen';
      if (['kunde', 'kein_interesse', 'kontaktiert', 'anrufwunsch'].includes(status)) return status;
      if (r.interessiert || r.interessiert_at) return 'interessiert';
      return 'offen';
    }

    const STATUS_TEXT = {
      offen: 'Offen', anrufwunsch: 'Anrufwunsch', interessiert: 'Interessiert',
      kontaktiert: 'Kontaktiert', kunde: 'Kunde', kein_interesse: 'Kein Interesse',
    };

    function topicLabel(r) {
      if (r.vorlage_slug) return THEMA_LABELS[r.vorlage_slug] || r.vorlage_slug;
      return r.typ === 'info' ? 'Allgemeine Beratung' : 'Direkte Empfehlung';
    }

    function initials(name) {
      const parts = String(name || '?').trim().split(/\s+/).filter(Boolean);
      return escapeHtml(parts.slice(0, 2).map(part => part[0]).join('').toUpperCase() || '?');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
    }

    /* ---------- Schnell-Menü (Rechtsklick auf eine Empfehlung) ---------- */
    const ctxMenu = document.getElementById('ctxMenu');
    const ctxHead = document.getElementById('ctxHead');
    const toastEl = document.getElementById('toast');
    let ctxTarget = null; // { id, href, status }
    let toastTimer;

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.hidden = false;
      requestAnimationFrame(() => toastEl.classList.add('show'));
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
        setTimeout(() => { toastEl.hidden = true; }, 250);
      }, 2200);
    }

    function hideCtx() {
      ctxMenu.hidden = true;
      ctxTarget = null;
      // aktive Markierung auf der Zeile entfernen
      document.querySelectorAll('.liste-zeile.ctx-active').forEach(el => el.classList.remove('ctx-active'));
    }

    function openCtx(x, y, row) {
      const item = allItems.find(r => String(r.id) === String(row.dataset.id));
      ctxTarget = { id: row.dataset.id, href: row.getAttribute('href'), status: row.dataset.status };
      ctxHead.textContent = (item && item.empfaenger_name) ? item.empfaenger_name : 'Empfehlung';
      // Aktuellen Status im Menü markieren
      ctxMenu.querySelectorAll('.ctx-item').forEach(b => {
        b.classList.toggle('is-current', b.dataset.act === 'status' && b.dataset.val === ctxTarget.status);
      });
      row.classList.add('ctx-active');
      // Erst sichtbar machen (für Maße), dann positionieren + an Viewport klemmen
      ctxMenu.hidden = false;
      const mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
      const px = Math.min(x, window.innerWidth - mw - 8);
      const py = Math.min(y, window.innerHeight - mh - 8);
      ctxMenu.style.left = Math.max(8, px) + 'px';
      ctxMenu.style.top = Math.max(8, py) + 'px';
    }

    document.getElementById('list').addEventListener('contextmenu', (e) => {
      const row = e.target.closest('.liste-zeile');
      if (!row) return;
      e.preventDefault();
      openCtx(e.clientX, e.clientY, row);
    });

    ctxMenu.addEventListener('click', async (e) => {
      const btn = e.target.closest('.ctx-item');
      if (!btn || !ctxTarget) return;
      const { id, href, status } = ctxTarget;
      const act = btn.dataset.act;

      if (act === 'open') { window.location.href = href; return; }
      if (act === 'new') { window.location.href = 'neu.html'; return; }
      if (act === 'edit') { openEditOverlay(id); hideCtx(); return; }

      if (act === 'delete') {
        const item = allItems.find(r => String(r.id) === String(id));
        const nm = (item && item.empfaenger_name) ? item.empfaenger_name : 'diese Empfehlung';
        hideCtx();
        if (!confirm(`Empfehlung von ${nm} wirklich löschen? Das lässt sich nicht rückgängig machen.`)) return;
        try {
          const { error } = await deleteEmpfehlung(id);
          if (error) throw error;
          showToast('Empfehlung gelöscht');
          await refresh();
        } catch (err) {
          console.warn('[ctx] delete fehlgeschlagen', err);
          showToast('Fehler beim Löschen');
        }
        return;
      }

      hideCtx();

      try {
        if (act === 'interessiert') {
          const { error } = await setInteressiert(id, true);
          if (error) throw error;
          showToast('Als Interessent markiert');
        } else if (act === 'status') {
          const val = btn.dataset.val;
          if (val === status) { showToast('Status unverändert'); return; }
          const { error } = await updateStatus(id, val);
          if (error) throw error;
          const labels = { kunde: 'Als Kunde gewonnen \u{1F389}', anrufwunsch: 'Anrufwunsch gesetzt', kontaktiert: 'Als kontaktiert markiert', kein_interesse: 'Als „kein Interesse" markiert', offen: 'Zurück auf offen' };
          showToast(labels[val] || 'Status aktualisiert');
        }
        await refresh();
      } catch (err) {
        console.warn('[ctx] update fehlgeschlagen', err);
        showToast('Fehler beim Speichern');
      }
    });

    /* ---------- Inline-Bearbeiten-Overlay ---------- */
    const editModal = document.getElementById('editModal');
    const editName = document.getElementById('editName');
    const editTel = document.getElementById('editTel');
    const editThema = document.getElementById('editThema');
    const editNotiz = document.getElementById('editNotiz');
    const editSave = document.getElementById('editSave');
    let editId = null;
    let vorlagenLoaded = false;

    async function ensureVorlagen() {
      if (vorlagenLoaded) return;
      vorlagenLoaded = true;
      const vorlagen = await getVorlagen(window.ENV_BERATER_ID || null);
      for (const v of vorlagen) {
        const opt = document.createElement('option');
        opt.value = v.slug;
        // Gesperrte Themen bleiben sichtbar, lassen sich aber nicht neu wählen (Phase 345).
        const gesperrt = themaGesperrt(v);
        opt.textContent = gesperrt ? `${v.titel || v.slug} (gesperrt)` : (v.titel || v.slug);
        opt.disabled = gesperrt;
        editThema.appendChild(opt);
      }
    }

    async function openEditOverlay(id) {
      const item = allItems.find(r => String(r.id) === String(id));
      if (!item) return;
      editId = id;
      await ensureVorlagen();
      editName.value = item.empfaenger_name || '';
      editTel.value = item.empfaenger_telefon || '';
      editThema.value = item.vorlage_slug || '';
      editNotiz.value = item.notiz || '';
      editModal.hidden = false;
      requestAnimationFrame(() => editModal.classList.add('open'));
      setTimeout(() => editName.focus(), 60);
    }

    function closeEditOverlay() {
      editModal.classList.remove('open');
      setTimeout(() => { editModal.hidden = true; }, 220);
      editId = null;
    }

    editSave.addEventListener('click', async () => {
      if (!editId) return;
      const fields = {
        empfaenger_name: editName.value.trim(),
        empfaenger_telefon: editTel.value.trim() || null,
        vorlage_slug: editThema.value || null,
        notiz: editNotiz.value.trim() || null,
      };
      editSave.disabled = true;
      editSave.textContent = 'Speichere…';
      try {
        const { error } = await updateEmpfehlung(editId, fields);
        if (error) throw error;
        closeEditOverlay();
        showToast('Änderungen gespeichert');
        await refresh();
      } catch (err) {
        console.warn('[edit] update fehlgeschlagen', err);
        showToast('Fehler beim Speichern');
      } finally {
        editSave.disabled = false;
        editSave.textContent = 'Speichern';
      }
    });

    document.getElementById('editCancel').addEventListener('click', closeEditOverlay);
    document.getElementById('editModalBd').addEventListener('click', closeEditOverlay);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !editModal.hidden) closeEditOverlay();
    });

    // Schließen bei Klick außerhalb, Scroll, Escape, erneutem Rechtsklick außerhalb
    document.addEventListener('click', (e) => {
      if (!ctxMenu.hidden && !ctxMenu.contains(e.target)) hideCtx();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCtx(); });
    window.addEventListener('scroll', () => { if (!ctxMenu.hidden) hideCtx(); }, true);
    window.addEventListener('resize', hideCtx);
  </script>
</body>
</html>
