<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Login · Empfehlungsportal</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <meta name="robots" content="noindex,nofollow" />
  <meta property="og:title" content="Empfehlungsportal · Berater-Bereich" />
  <meta property="og:image" content="https://empfehlungsportal.vercel.app/assets/images/og-cover.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/dna.css?v=11" />
  <script src="../js/config.js"></script>
</head>
<body>

  <main class="dashboard-login">
    <div class="login-wrap">
      <section class="login-card login-marke">
        <div class="login-crest">
          <img class="crest-mark" src="../assets/images/team-wachsbleiche-marke-96.webp" width="96" height="96"
               alt="Team Wachsbleiche · Regionaldirektion Kai Blobel &amp; Team" />
        </div>

        <div class="login-head">
          <h1>Empfehlungsportal</h1>
          <p class="login-rd">Regionaldirektion Kai&nbsp;Blobel &amp; Team</p>
          <span class="login-goldrule" aria-hidden="true"></span>
        </div>

        <form id="loginForm" novalidate>
          <input id="email" type="email" autocomplete="email" placeholder="E-Mail" required />
          <input id="password" type="password" autocomplete="current-password" placeholder="Passwort" required />
          <div class="login-error" id="loginError"></div>
          <button type="submit" class="btn btn-primary">Anmelden</button>
        </form>
      </section>
      <p class="login-foot">Dein persönlicher Überblick</p>

      <footer class="login-legal">
        <p>An der Wachsbleiche 1a · 03046 Cottbus</p>
        <p>
          <a href="https://www.dvag.de/kai.blobel/impressum.html" target="_blank" rel="noopener">Impressum</a>
          <span aria-hidden="true">·</span>
          <a href="https://www.dvag.de/kai.blobel/datenschutz.html" target="_blank" rel="noopener">Datenschutz</a>
        </p>
      </footer>
    </div>
  </main>

  <script type="module">
    import { login, redirectIfAuthed } from '../js/dashboard.js';

    // Auf der Anmeldeseite steht bewusst nur die Marke der Regionaldirektion.
    // Das gemerkte Berater-Foto erscheint erst nach dem Anmelden im Kopf der
    // Seiten dahinter, hier hätte es je nach Gerät ein anderes Bild gezeigt.

    redirectIfAuthed();

    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('loginError');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        errBox.textContent = 'Bitte E-Mail und Passwort eingeben.';
        errBox.classList.add('show');
        return;
      }
      const { error } = await login(email, password);
      if (error) {
        errBox.textContent = error.message === 'Invalid login credentials'
          ? 'E-Mail oder Passwort falsch.'
          : (error.message || 'Anmeldung fehlgeschlagen.');
        errBox.classList.add('show');
        return;
      }
      window.location.href = 'overview.html';
    });
  </script>
</body>
</html>
